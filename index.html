<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي القدرات اللفظي - أ/ عبدالعزيز الفيفي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --maroon: #800000; --gold: #d4af37; --bg: #fdfaf1; --white: #ffffff; --correct: #2e7d32; --wrong: #c62828; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; user-select: none; }
        .quiz-card { background: var(--white); width: 100%; max-width: 900px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 10px solid var(--maroon); padding: 30px; position: relative; }
        .header { text-align: center; border-bottom: 2px solid var(--gold); margin-bottom: 20px; padding-bottom: 10px; }
        .input-group { margin: 15px auto; width: 85%; text-align: right; }
        input, select { width: 100%; padding: 14px; border-radius: 8px; border: 1.5px solid #ccc; font-size: 1.1rem; outline: none; box-sizing: border-box; background: #fff; margin-bottom: 10px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: #f4f4f4; padding: 12px 20px; border-radius: 10px; margin-bottom: 20px; }
        .q-section-tag { color: var(--maroon); font-weight: bold; font-size: 1rem; margin-bottom: 10px; display: block; text-align: right; border-right: 4px solid var(--gold); padding-right: 10px; }
        .q-text { font-size: 1.4rem; font-weight: bold; text-align: center; margin-bottom: 30px; line-height: 1.8; color: #222; min-height: 50px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .opt { padding: 18px; border: 2px solid #ececec; border-radius: 12px; cursor: pointer; transition: 0.2s; text-align: center; font-size: 1.2rem; background: #fff; font-weight: 600; }
        .opt:hover { border-color: var(--gold); background: #fffcf0; }
        .correct { background: var(--correct) !important; color: white; border-color: var(--correct) !important; }
        .wrong { background: var(--wrong) !important; color: white; border-color: var(--wrong) !important; }
        .btn { background: var(--maroon); color: var(--gold); padding: 14px 50px; border: none; border-radius: 10px; cursor: pointer; font-size: 1.2rem; font-weight: bold; }
        .hidden { display: none !important; }
        #timer { color: var(--maroon); font-size: 1.6rem; font-weight: 800; border: 2px solid var(--gold); padding: 5px 15px; border-radius: 50px; }
        .fb-box { margin-top: 20px; padding: 20px; background: #f0f4ff; border-right: 8px solid var(--gold); border-radius: 8px; line-height: 1.8; display: none; color: #1a237e; }
        .footer { margin-top: 30px; text-align: center; border-top: 1px solid #eee; padding-top: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="quiz-card" id="login-page">
    <div class="header"><h2>تسجيل الدخول للاختبار</h2></div>
    <div class="input-group">
        <input type="text" id="student-name" placeholder="اسمك الثلاثي">
        <select id="student-class">
            <option value="">اختر الفصل</option>
            <option>101</option><option>102</option><option>103</option><option>104</option>
        </select>
        <button class="btn" style="width:100%" onclick="startQuiz()">ابدأ التحدي</button>
    </div>
</div>

<div class="quiz-card hidden" id="quiz-page">
    <div class="nav-bar">
        <span id="timer">45</span>
        <span id="q-counter" style="font-weight:bold; color:var(--maroon);">1 / 30</span>
    </div>
    <span class="q-section-tag" id="section-tag">تناظر لفظي</span>
    <div class="q-text" id="question-text"></div>
    <div class="options-grid" id="options-container"></div>
    <div class="fb-box" id="feedback-area"></div>
    <div style="text-align:center; margin-top:20px;">
        <button id="next-btn" class="btn hidden" onclick="nextQuestion()">السؤال التالي</button>
    </div>
</div>

<div class="quiz-card hidden" id="result-page">
    <div class="header"><h2>تم الانتهاء!</h2></div>
    <div style="text-align:center; padding:20px;">
        <h1 id="score-text" style="font-size:3rem; color:var(--maroon);">0 / 30</h1>
        <p id="cloud-msg" style="color:green; font-weight:bold;"></p>
        <button class="btn" onclick="location.reload()">إعادة الاختبار</button>
    </div>
</div>

<script>
    const firebaseConfig = { projectId: "aztlg-494c3" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const quizData = [
        { q: "حكم : قضاة", opts: ["سقف : بناء", "شعاع : شمس", "معلم : تعليم", "سفينة : بحر"], ans: "شعاع : شمس", tag: "تناظر لفظي", tip: "القضاة يصدرون الحكم، والشمس تصدر الشعاع." },
        { q: "غضب : حلم", opts: ["جوع : شبع", "قتل : سجن", "لعب : نوم", "دراسة : إجازة"], ans: "جوع : شبع", tag: "تناظر لفظي", tip: "علاقة تضاد." },
        { q: "حروف : كلمات", opts: ["أغصان : أشجار", "قفز : وثب", "قاضي : عدل", "عطور : زهور"], ans: "أغصان : أشجار", tag: "تناظر لفظي", tip: "علاقة جزء من كل." },
        { q: "سيف : غمد", opts: ["رسالة : بريد", "أسد : عرين", "حذاء : قدم", "محطة : قطار"], ans: "أسد : عرين", tag: "تناظر لفظي", tip: "علاقة مكانية (احتواء)." },
        { q: "حاد : مثلم", opts: ["واسع : عميق", "طويل : ممتد", "كرم : بخل", "حليم : صادق"], ans: "كرم : بخل", tag: "تناظر لفظي", tip: "علاقة تضاد." },
        { q: "إشراك : إسلام", opts: ["إخراج : قدوم", "إكرام : إسراف", "إدناء : إقصاء", "إيمان : إحسان"], ans: "إدناء : إقصاء", tag: "تناظر لفظي", tip: "علاقة تضاد." },
        { q: "حيوان : مفترس", opts: ["أزرق : قلم", "كريم : بخيل", "شهادة : زور", "نبات : أخضر"], ans: "شهادة : زور", tag: "تناظر لفظي", tip: "علاقة صفة (سلبية)." },
        { q: "قشرة : برتقال", opts: ["مزرعة : حبوب", "بحيرة : أسماك", "هالة : قمر", "محل : عسل"], ans: "هالة : قمر", tag: "تناظر لفظي", tip: "علاقة إحاطة." },
        { q: "مريض : دعاء", opts: ["مجرم : محاكمة", "صغير : سفر", "السارق : قتل", "دواء : داء"], ans: "مجرم : محاكمة", tag: "تناظر لفظي", tip: "المريض يحتاج دعاء والمجرم يحتاج محاكمة." },
        { q: "قصيدة : بيت", opts: ["غرفة : مطبخ", "ورقة : كتاب", "لحم : دجاج", "ذهب : قلادة"], ans: "ورقة : كتاب", tag: "تناظر لفظي", tip: "علاقة جزء من كل." },
        { q: "لا يتصف ........ إلا ........", opts: ["بالحقد - دنيء", "بالضغينة - عظيم", "بالنعيم - كريم", "بالصدق - أحمق"], ans: "بالحقد - دنيء", tag: "إكمال جمل", tip: "سياق سلبي يناسب الحقد والدناءة." },
        { q: "الكرم ........ العيوب، والبخل ........", opts: ["يخفي - يواريها", "يخفي - يكشفها (يظهرها)", "يكشف - يظهرها", "يغطي - يخفيها"], ans: "يخفي - يكشفها (يظهرها)", tag: "إكمال جمل", tip: "الكرم يستر العيوب والبخل يفضحها." },
        { q: "العلم ما ........ وليس العلم ما ........", opts: ["فهم - قرئ", "كسب - خسر", "عمل - فهم", "نفع - حفظ"], ans: "نفع - حفظ", tag: "إكمال جمل", tip: "العبرة بنفع العلم لا بمجرد حفظه." },
        { q: "من الجميل أن تستفيد من ........ الآخرين، والأجمل أن تتوقف عن أخطائك قبل أن ........ الآخرين.", opts: ["موعظة - يغفل", "نصح - ينصحك", "أخطاء - يزول", "خبرات - يكتشفها"], ans: "موعظة - يغفل", tag: "إكمال جمل", tip: "الاستفادة من تجارب ومواعظ الغير." },
        { q: "ندنو من ........ بقدر ما ندنو من التواضع.", opts: ["العظمة", "الكبر", "الضعف", "الشفقة"], ans: "العظمة", tag: "إكمال جمل", tip: "التواضع يرفع من شأن الإنسان." },
        { q: "لا يوجد سائل يذيب كل شيء، وإلا فكيف نجد ........ التي تحويه؟", opts: ["المواد", "الأواني", "الأوعية", "المخابر"], ans: "الأوعية", tag: "إكمال جمل", tip: "سياق منطقي يشير للأوعية الحافظة." },
        { q: "يُعد الحج مجمعاً ........ وموسماً ........ وفريضة ........", opts: ["إيمانياً - اقتصادياً - عبادية", "إسلامياً - تجارياً - دينية", "عالمياً - سنوياً - إلهية", "بشرياً - ثقافياً - شرعية"], ans: "إيمانياً - اقتصادياً - عبادية", tag: "إكمال جمل", tip: "وصف شامل لمنافع الحج." },
        { q: "المنصف هو الذي ........ بخصمه في ........", opts: ["يعترف - غيبته", "يندفع - حضوره", "يفتخر - علنه", "يجهر - صمته"], ans: "يعترف - غيبته", tag: "إكمال جمل", tip: "الإنصاف أن تذكر فضل خصمك في غيابه." },
        { q: "صناعة ........ تحتاج إلى ........ أكثر من ........", opts: ["السيارات - قوة - فكر", "الأبطال - مواقف - كلام", "القادة - ذكاء - عاطفة", "النجاح - جهد - تمني"], ans: "الأبطال - مواقف - كلام", tag: "إكمال جمل", tip: "الأبطال تصنعهم الشدائد والمواقف." },
        { q: "نفسك ........ إن لم تشغلها بالحق شغلتك بالباطل.", opts: ["أمانة", "عدوة", "وسيلة", "مطية"], ans: "مطية", tag: "إكمال جمل", tip: "التحذير من ترك النفس للفراغ." },
        { q: "الموظف المخلص هو الذي يحرص على وقت ........", opts: ["الراحة", "العمل", "المكافأة", "الخروج"], ans: "العمل", tag: "إكمال جمل", tip: "الإخلاص يقتضي حفظ وقت العمل." },
        { q: "من يحمل ........ لنفسه فإنه يحمل ........ ثقيلاً.", opts: ["هماً - عبئاً", "حزناً - هماً", "حقداً - جرحاً", "خوفاً - عائقاً"], ans: "هماً - عبئاً", tag: "إكمال جمل", tip: "الهم الشخصي يثقل كاهل صاحبه." },
        { q: "الابتسامة ........ صامتة لا تحتاج إلى ........", opts: ["لغة - ترجمة", "هدية - مال", "رسالة - ورق", "كلمة - نطق"], ans: "لغة - ترجمة", tag: "إكمال جمل", tip: "الابتسامة لغة عالمية يفهمها الجميع." },
        { q: "يجب أن نزرع ........ حتى نحصد ........", opts: ["القمح - الخبز", "الأمل - النجاح", "الخير - السعادة", "الورود - العطر"], ans: "الأمل - النجاح", tag: "إكمال جمل", tip: "علاقة سبب بنتيجة معنوية." },
        { q: "من زاد ........ قل ........", opts: ["ماله - همه", "علمه - كبره", "أدبه - أعداؤه", "حياؤه - خطؤه"], ans: "أدبه - أعداؤه", tag: "إكمال جمل", tip: "حسن الخلق يقلل من الخصومات." },
        { q: "الحياة بدون ........ كأنها صحراء بلا ........", opts: ["أصدقاء - ماء", "أهداف - طريق", "أمل - ضياء", "عمل - نتيجة"], ans: "أمل - ضياء", tag: "إكمال جمل", tip: "الأمل هو النور الذي يضيء الحياة." },
        { q: "كن ........ لترى الوجود ........", opts: ["متفائلاً - جميلاً", "جميلاً - جميلاً", "سعيداً - رائعاً", "راضياً - مرضياً"], ans: "جميلاً - جميلاً", tag: "إكمال جمل", tip: "مقولة فلسفية مشهورة." },
        { q: "القراءة هي غذاء ........ كما أن الطعام غذاء ........", opts: ["العقل - الروح", "الفكر - الجسد", "الروح - القلب", "العلم - النفس"], ans: "الفكر - الجسد", tag: "إكمال جمل", tip: "تشبيه أهمية القراءة للعقل بالطعام للبدن." },
        { q: "من استهان ........ ضاع ........", opts: ["بالوقت - مستقبله", "بالصديق - وده", "بالدرس - نجاحه", "بالمال - رزقه"], ans: "بالوقت - مستقبله", tag: "إكمال جمل", tip: "إضاعة الوقت تؤدي لضياع المستقبل." },
        { q: "الصدق ........ والكلمة الطيبة ........", opts: ["نجاة - صدقة", "أمانة - أمان", "فوز - راحة", "قوة - محبة"], ans: "نجاة - صدقة", tag: "إكمال جمل", tip: "الصدق ينجي والكلمة الطيبة لها أجر الصدقة." }
    ];

    let currentIdx = 0, userScore = 0, sName = '', sClass = '', timer;

    function startQuiz() {
        sName = document.getElementById('student-name').value;
        sClass = document.getElementById('student-class').value;
        if(!sName || !sClass) return alert("فضلاً سجل اسمك وفصلك");
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('quiz-page').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        if(currentIdx >= quizData.length) return finishQuiz();
        const item = quizData[currentIdx];
        document.getElementById('q-counter').innerText = `${currentIdx + 1} / ${quizData.length}`;
        document.getElementById('section-tag').innerText = item.tag;
        document.getElementById('question-text').innerText = item.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        item.opts.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'opt';
            div.innerText = opt;
            div.onclick = () => check(opt, div);
            container.appendChild(div);
        });
        document.getElementById('feedback-area').style.display = 'none';
        document.getElementById('next-btn').classList.add('hidden');
        startTimer();
    }

    function check(sel, el) {
        clearInterval(timer);
        const correctAns = quizData[currentIdx].ans;
        const opts = document.querySelectorAll('.opt');
        opts.forEach(o => o.style.pointerEvents = 'none');
        if(sel === correctAns) { el.classList.add('correct'); userScore++; }
        else { if(el) el.classList.add('wrong'); opts.forEach(o => { if(o.innerText === correctAns) o.classList.add('correct'); }); }
        const fbArea = document.getElementById('feedback-area');
        fbArea.innerText = "تحليل أ/ عبدالعزيز: " + quizData[currentIdx].tip; fbArea.style.display = 'block';
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function startTimer() {
        let s = 45; document.getElementById('timer').innerText = s;
        clearInterval(timer);
        timer = setInterval(() => { s--; document.getElementById('timer').innerText = s; if(s <= 0) { clearInterval(timer); check("N/A", null); } }, 1000);
    }

    function nextQuestion() { currentIdx++; loadQuestion(); }

    async function finishQuiz() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');
        document.getElementById('score-text').innerText = `${userScore} / ${quizData.length}`;
        try {
            await db.collection("student_results").add({
                name: sName, student_class: sClass, score: userScore, total: quizData.length,
                time: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById('cloud-msg').innerText = "✅ تم تسجيل إبداعك في المنصة يا " + sName;
        } catch(e) { console.error(e); }
    }
</script>

<div class="footer">أ/ عبدالعزيز الفيفي - محاكي القدرات اللفظي الحديث 2026</div>
</body>
</html>
