<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي القدرات اللفظي - أ/ عبدالعزيز الفيفي</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --maroon: #800000; --gold: #d4af37; --bg: #fdfaf1; --white: #ffffff; --correct: #2e7d32; --wrong: #c62828; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; user-select: none; }
        .quiz-card { background: var(--white); width: 100%; max-width: 900px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 10px solid var(--maroon); padding: 30px; position: relative; }
        .header { text-align: center; border-bottom: 2px solid var(--gold); padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { color: var(--maroon); margin: 0; font-size: 24px; }
        .info-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: #555; }
        .question-box { background: #f9f9f9; padding: 20px; border-right: 5px solid var(--gold); margin-bottom: 20px; border-radius: 8px; }
        .question-text { font-size: 22px; color: #333; margin-bottom: 10px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option { padding: 15px; border: 2px solid #eee; border-radius: 12px; cursor: pointer; transition: 0.3s; text-align: center; font-size: 18px; }
        .option:hover { border-color: var(--gold); background: #fffcf5; }
        .option.correct { background: var(--correct); color: white; border-color: var(--correct); }
        .option.wrong { background: var(--wrong); color: white; border-color: var(--wrong); }
        .feedback { display: none; margin-top: 20px; padding: 15px; border-radius: 8px; background: #e3f2fd; color: #0d47a1; font-weight: bold; border-right: 5px solid #2196f3; }
        .hidden { display: none; }
        button { background: var(--maroon); color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #a00000; }
        .footer { margin-top: 30px; text-align: center; font-size: 14px; color: #777; border-top: 1px solid #eee; padding-top: 15px; }
        input[type="text"] { width: 80%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; text-align: center; font-size: 16px; }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="header">
        <h1>تجميعات القدرات اللفظية (2 مايو 2026)</h1>
        <p>إعداد أ/ عبدالعزيز الفيفي</p>
    </div>

    <div id="login-page">
        <div style="text-align:center;">
            <h3>أهلاً بك يا بطل! أدخل بياناتك للبدء:</h3>
            <input type="text" id="student-name" placeholder="الاسم الثلاثي"><br>
            <input type="text" id="student-class" placeholder="الفصل (مثال: 3/أ)"><br><br>
            <button onclick="startQuiz()">ابدأ التحدي</button>
        </div>
    </div>

    <div id="quiz-page" class="hidden">
        <div class="info-bar">
            <span>السؤال: <span id="q-count">1</span> / 15</span>
            <span id="timer-box">المتبقي: <span id="timer">45</span> ثانية</span>
        </div>
        <div class="question-box">
            <div id="q-section" style="color: var(--gold); font-weight: bold; margin-bottom: 5px;"></div>
            <div id="q-text" class="question-text"></div>
        </div>
        <div class="options-grid" id="options-container"></div>
        <div id="feedback-area" class="feedback"></div>
        <div style="text-align: left; margin-top: 20px;">
            <button id="next-btn" class="hidden" onclick="nextQuestion()">التالي</button>
        </div>
    </div>

    <div id="result-page" class="hidden" style="text-align: center;">
        <h2 id="result-title">انتهى الاختبار!</h2>
        <div style="font-size: 48px; color: var(--maroon); margin: 20px 0;" id="score-text">0 / 0</div>
        <p id="cloud-msg"></p>
        <button onclick="location.reload()">محاولة أخرى</button>
    </div>

    <div class="footer">
        قناة التليجرام: @qudrat_ta7sely | حقوق الطبع محفوظة أ/ عبدالعزيز الفيفي
    </div>
</div>

<script>
    // تهيئة Firebase (استخدم بياناتك الحالية)
    const firebaseConfig = {
        apiKey: "AIzaSy...", // استبدلها بالـ API Key الخاص بك
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.appspot.com",
        messagingSenderId: "958...",
        appId: "1:958..."
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const quizData = [
        { section: "تناظر لفظي", question: "حكم : قضاة", options: ["سقف : بناء", "شعاع : شمس", "معلم : تعليم", "سفينة : بحر"], answer: "شعاع : شمس", tip: "العلاقة مصدرية؛ الحكم يصدر من القضاة والشعاع يصدر من الشمس." },
        { section: "تناظر لفظي", question: "غضب : حلم", options: ["جوع : شبع", "قتل : سجن", "لعب : نوم", "دراسة : إجازة"], answer: "جوع : شبع", tip: "العلاقة تضاد؛ الغضب عكس الحلم والجوع عكس الشبع." },
        { section: "تناظر لفظي", question: "حروف : كلمات", options: ["أغصان : أشجار", "قفز : وثب", "قاضي : عدل", "عطور : زهور"], answer: "أغصان : أشجار", tip: "العلاقة جزء من كل؛ الحرف جزء من الكلمة والغصن جزء من الشجرة." },
        { section: "تناظر لفظي", question: "سيف : غمد", options: ["رسالة : بريد", "أسد : عرين", "حذاء : قدم", "محطة : قطار"], answer: "أسد : عرين", tip: "العلاقة مكانية (بيت لـ)؛ السيف مكانه الغمد والأسد مكانه العرين." },
        { section: "تناظر لفظي", question: "حاد : مثلم", options: ["واسع : عميق", "طويل : ممتد", "كرم : بخل", "حليم : صادق"], answer: "كرم : بخل", tip: "العلاقة تضاد؛ الحاد عكس المثلم والكرم عكس البخل." },
        { section: "تناظر لفظي", question: "إشراك : إسلام", options: ["إخراج : قدوم", "إكرام : إسراف", "إدناء : إقصاء", "إيمان : إحسان"], answer: "إدناء : إقصاء", tip: "العلاقة تضاد." },
        { section: "تناظر لفظي", question: "حيوان : مفترس", options: ["أزرق : قلم", "كريم : بخيل", "شهادة : زور", "نبات : أخضر"], answer: "شهادة : زور", tip: "صفة سلبية." },
        { section: "تناظر لفظي", question: "قشرة : برتقال", options: ["مزرعة : حبوب", "بحيرة : أسماك", "هالة : قمر", "محل : عسل"], answer: "هالة : قمر", tip: "إحاطة." },
        { section: "تناظر لفظي", question: "مريض : دعاء", options: ["مجرم : محاكمة", "صغير : سفر", "السارق : قتل", "دواء : داء"], answer: "مجرم : محاكمة", tip: "احتياج." },
        { section: "تناظر لفظي", question: "قصيدة : بيت", options: ["غرفة : مطبخ", "ورقة : كتاب", "لحم : دجاج", "ذهب : قلادة"], answer: "ورقة : كتاب", tip: "جزء من كل." },
        { section: "إكمال جمل", question: "لا يتصف ........ إلا ........", options: ["بالحقد - دنيء", "بالضغينة - عظيم", "بالنعيم - كريم", "بالصدق - أحمق"], answer: "بالحقد - دنيء", tip: "تناسق المعنى السلبي." },
        { section: "إكمال جمل", question: "الكرم ........ العيوب، والبخل ........", options: ["يخفي - يواريها", "يخفي - يكشفها", "يكشف - يظهرها", "يغطي - يخفيها"], answer: "يخفي - يكشفها", tip: "تضاد الأثر." },
        { section: "إكمال جمل", question: "العلم ما ........ وليس العلم ما ........", options: ["فهم - قرئ", "كسب - خسر", "عمل - فهم", "نفع - حفظ"], answer: "نفع - حفظ", tip: "العبرة بالنفع." },
        { section: "إكمال جمل", question: "من الجميل أن تستفيد من ........ الآخرين، والأجمل أن تتوقف عن أخطائك قبل أن ........ الآخرين.", options: ["موعظة - يغفل", "نصح - ينصحك", "أخطاء - يلاحظها", "خبرات - يكتشفها"], answer: "أخطاء - يلاحظها", tip: "تجنب تكرار الخطأ." },
        { section: "إكمال جمل", question: "ندنو من ........ بقدر ما ندنو من التواضع.", options: ["العظمة", "الكبر", "الضعف", "الشفقة"], answer: "العظمة", tip: "التواضع يرفع الشأن." }
    ];

    let currentIdx = 0;
    let userScore = 0;
    let timer;
    let sName, sClass;

    function startQuiz() {
        sName = document.getElementById('student-name').value.trim();
        sClass = document.getElementById('student-class').value.trim();
        if(!sName || !sClass) return alert("لطفاً، أكمل البيانات");
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('quiz-page').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        if(currentIdx >= quizData.length) return finishQuiz();
        
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('feedback-area').style.display = 'none';
        document.getElementById('q-count').innerText = currentIdx + 1;
        
        const q = quizData[currentIdx];
        document.getElementById('q-section').innerText = q.section;
        document.getElementById('q-text').innerText = q.question;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        q.options.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'option';
            div.innerText = opt;
            div.onclick = () => check(opt, div);
            container.appendChild(div);
        });
        startTimer();
    }

    function check(selected, element) {
        clearInterval(timer);
        const correct = quizData[currentIdx].answer;
        const options = document.querySelectorAll('.option');
        
        options.forEach(opt => opt.style.pointerEvents = 'none');

        if(selected === correct) {
            element.classList.add('correct');
            userScore++;
        } else {
            if(element) element.classList.add('wrong');
            options.forEach(opt => {
                if(opt.innerText === correct) opt.classList.add('correct');
            });
        }

        const fb = document.getElementById('feedback-area');
        fb.innerText = "تحليل أ/ عبدالعزيز: " + quizData[currentIdx].tip;
        fb.style.display = 'block';
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function startTimer() {
        let s = 45;
        document.getElementById('timer').innerText = s;
        clearInterval(timer);
        timer = setInterval(() => {
            s--;
            document.getElementById('timer').innerText = s;
            if(s <= 0) {
                clearInterval(timer);
                check("N/A", null);
            }
        }, 1000);
    }

    function nextQuestion() {
        currentIdx++;
        loadQuestion();
    }

    async function finishQuiz() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');
        document.getElementById('score-text').innerText = `${userScore} / ${quizData.length}`;
        
        try {
            await db.collection("student_results").add({
                name: sName,
                class: sClass,
                score: userScore,
                total: quizData.length,
                date: new Date().toLocaleString('ar-SA')
            });
            document.getElementById('cloud-msg').innerText = "تم حفظ نتيجتك بنجاح يا بطل!";
        } catch(e) {
            document.getElementById('cloud-msg').innerText = "حدث خطأ في حفظ النتيجة، صور الشاشة.";
        }
    }
</script>

</body>
</html>
